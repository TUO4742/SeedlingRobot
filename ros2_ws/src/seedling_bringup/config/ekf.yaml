### robot_localization EKF
### 与 RosCar 的 ekf.yaml 对应，但只融合编码器里程计（本机无 IMU）
### 若后续加装 WT9011G4K，取消 imu0 段注释即可

ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom_combined
    base_link_frame: base_footprint
    world_frame: odom_combined

    publish_tf: true
    print_dt: false
    debug: false
    permit_corrected_publication: false

    # --- 轮式里程计 ---
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 3.0

    # --- IMU（默认关闭，装了再打开）---
    # imu0: /imu/data_raw
    # imu0_config: [false, false, false,
    #               false, false, false,
    #               false, false, false,
    #               false, false, true,
    #               false, false, false]
    # imu0_differential: false
    # imu0_relative: true
    # imu0_queue_size: 10
    # imu0_remove_gravitational_acceleration: true
    # imu0_twist_rejection_threshold: 1.542
